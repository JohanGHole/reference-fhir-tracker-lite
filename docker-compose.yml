# DHIS2 for the FHIR -> Tracker (lite) reference implementation.
#
# The integration itself is NOT containerised here on purpose: run it on the host
# (`cd iol && ./mvnw spring-boot:run`) so that the Camel MCP server's runtime tools can see it
# via the Camel CLI connector. A Dockerfile is provided in iol/ for deployment.
services:
  dhis2:
    image: "${DHIS2_IMAGE:-dhis2/core:42.5.1}"
    restart: unless-stopped
    ports:
      - "${DHIS2_PORT:-8080}:8080"
    volumes:
      - ./config/dhis2/dhis.conf:/opt/dhis2/dhis.conf:ro
    depends_on:
      dhis2-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8080/dhis-web-login/ 2>&1| grep -q 'HTTP.*200'" ]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 10

  dhis2-db:
    image: ghcr.io/baosystems/postgis:13-3.4
    environment:
      POSTGRES_USER: dhis
      POSTGRES_DB: dhis
      POSTGRES_PASSWORD: dhis
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dhis -d dhis" ]
      interval: 2s
      timeout: 3s
      retries: 30

  dhis2-bootstrap:
    image: curlimages/curl:8.11.1
    depends_on:
      dhis2:
        condition: service_healthy
    environment:
      DHIS2_URL: http://dhis2:8080
    volumes:
      - ./config/dhis2:/bootstrap:ro
    entrypoint: [ "sh", "/bootstrap/bootstrap.sh" ]
    restart: "no"
